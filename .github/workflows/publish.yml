# TS SDK publish — tag-driven npm publish via Trusted Publishing / OIDC (cycle 177).
# Push a bare semver tag (TS uses no `v` prefix, e.g. `0.9.1`) → lint/typecheck/test/build gate → `npm publish`.
#
# Auth = npm Trusted Publishing (OIDC) — NO long-lived NPM_TOKEN. One-time maintainer setup:
#   npmjs.com → the `@wishknish/knishio-client-ts` package → Settings → Trusted Publisher →
#   GitHub Actions: organization `WishKnish`, repository `KnishIO-Client-TS`, workflow `publish.yml`.
#   (All fields case-sensitive; npm validates them only at publish time.)
# Requires npm >= 11.5.1 + Node >= 22.14 (we use Node 24 + `npm install -g npm@latest`). Provenance
# attestations are generated automatically under trusted publishing.
name: Publish

on:
  push:
    tags:
      - '[0-9]*'
  # Dry run. This workflow is otherwise reachable only by pushing a tag, which publishes — so
  # every change to it would ship unexercised. A dispatch runs the version gate and the full
  # lint/typecheck/test/build path and stops before publishing, because the publish job is
  # guarded on `github.event_name == 'push'`.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to dry-run the gate against, e.g. 0.9.4. Publishes NOTHING.'
        required: true
        type: string

permissions:
  id-token: write   # OIDC for npm Trusted Publishing
  contents: write   # create the GitHub Release

jobs:
  # Split out of the publish job on purpose: `environment: release` is a deployment gate that
  # can require approval, and a dry run that uploads nothing should not have to pass it.
  verify:
    name: verify version + lint + typecheck + test + build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # The release gate must be at least as strict as ci.yml, which runs Node 20. When this job
    # ran only Node 24 it green-lit 0.9.6 with a `Promise.withResolvers` call (Node 22+) in a
    # test, which then failed ci.yml on Node 20 *after* the package had already published.
    # 20 is the lowest version the toolchain can run (vitest requires ^20 || ^22 || >=24), so it
    # is the floor this suite can actually enforce; the package's own `engines.node: >=18.0.0`
    # applies to consumers and is upheld in source by feature guards, not by this matrix.
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Refuse to publish a tag the manifest does not itself claim. Shared definition with
      # ci.yml and with local runs — see .github/scripts/check-version.sh.
      - name: Verify tag matches the declared SDK version
        # DISPATCH_TAG arrives via env, never interpolated into the shell text
        # (workflow-injection hygiene).
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            EXPECTED="${GITHUB_REF#refs/tags/}"
          else
            EXPECTED="$DISPATCH_TAG"
          fi
          bash .github/scripts/check-version.sh "$EXPECTED"

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          registry-url: 'https://registry.npmjs.org'
          # setup-node v5 enables package-manager caching by default (v4 did not). It detects
          # yarn from the committed .yarnrc.yml and points the cache at yarn's cache folder —
          # but this workflow installs with `npm install`, so that folder never exists and the
          # post-run cache save fails with 'Path Validation Error'. Nothing to cache here.
          package-manager-cache: false

      # Mirrors ci.yml's hardened install (ChainDrop response, 2026-08): script-free
      # cooldown resolve, then a locked install with lifecycle scripts disabled. If a
      # needed fix is younger than the 7-day cooldown, review it manually — never drop
      # the flag at publish time.
      - name: Resolve dependencies (script-free, 7-day cooldown)
        run: |
          set -euo pipefail
          CUTOFF="$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          # Named cooldown exception — see the identical block in ci.yml for the full rationale.
          # zod@4.5.4, published 2026-08-29T17:55:42Z via npm Trusted Publishing (OIDC), SLSA v1
          # provenance, zero runtime deps. SELF-EXPIRING after 2026-09-05T18:00Z.
          FLOOR='2026-08-29T18:00:00Z'
          if [ "$CUTOFF" \< "$FLOOR" ]; then CUTOFF="$FLOOR"; fi
          echo "cooldown cutoff: $CUTOFF"
          npm install --package-lock-only --ignore-scripts --before="$CUTOFF"

      - name: Install dependencies (locked, no lifecycle scripts)
        run: npm ci --ignore-scripts

      # Gate — never publish a tag that doesn't lint/typecheck/test/build clean.
      - name: ESLint (lint gate)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build

  publish:
    name: publish to npm (Trusted Publishing)
    needs: verify
    if: github.event_name == 'push'   # dispatch = dry run; never publishes
    runs-on: ubuntu-latest
    environment: release   # matches the npm trusted-publisher Environment + the repo's `release` env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # setup-node v5 enables package-manager caching by default (v4 did not). It detects
          # yarn from the committed .yarnrc.yml and points the cache at yarn's cache folder —
          # but this workflow installs with `npm install`, so that folder never exists and the
          # post-run cache save fails with 'Path Validation Error'. Nothing to cache here.
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1 (newer than the bundled npm).
      - name: Upgrade npm (>= 11.5.1 for trusted publishing)
        run: npm install -g npm@latest

      # This job holds `id-token: write` — the ChainDrop worm propagates through OIDC
      # trusted publishing when a malicious dependency script executes in a job like this
      # one. Scripts stay OFF and the resolve is cooldown-gated for exactly that reason.
      - name: Resolve dependencies (script-free, 7-day cooldown)
        run: |
          set -euo pipefail
          CUTOFF="$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          # Named cooldown exception — see the identical block in ci.yml for the full rationale.
          # zod@4.5.4, published 2026-08-29T17:55:42Z via npm Trusted Publishing (OIDC), SLSA v1
          # provenance, zero runtime deps. SELF-EXPIRING after 2026-09-05T18:00Z.
          FLOOR='2026-08-29T18:00:00Z'
          if [ "$CUTOFF" \< "$FLOOR" ]; then CUTOFF="$FLOOR"; fi
          echo "cooldown cutoff: $CUTOFF"
          npm install --package-lock-only --ignore-scripts --before="$CUTOFF"

      - name: Install dependencies (locked, no lifecycle scripts)
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # Release body = this tag's CHANGELOG.md section, NOT generate_release_notes.
      # generate_release_notes builds "What's Changed" from merged PULL REQUESTS in the tag
      # range. Releases here land as direct pushes to master, so 0.9.6..0.9.7 contained zero
      # PRs and the 0.9.7 release page published an empty body — nothing but a compare link —
      # for a release that shipped hardware envelope encryption. The curated CHANGELOG entry
      # is the source of truth; extract it and use it verbatim.
      #
      # This runs BEFORE `npm publish` on purpose. The empty-section guard below is only
      # useful if it aborts ahead of the irreversible upload; after it, a missing CHANGELOG
      # entry would leave a published package with no release page at all — the same
      # half-state this step exists to prevent. Extraction needs nothing but the checkout.
      - name: Extract this tag's CHANGELOG section
        run: |
          set -euo pipefail
          # Derived from the tag itself, tolerating a leading `v`, so this needs no cross-job
          # output plumbing through the Node-version matrix in `verify`.
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="${TAG_VERSION#v}"
          awk -v ver="## [$TAG_VERSION]" '
            index($0, ver) == 1 { inside = 1; print; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error file=CHANGELOG.md::No '## [$TAG_VERSION]' section found — refusing to publish with empty release notes."
            exit 1
          fi
          echo "Release notes for $TAG_VERSION:"
          cat /tmp/release-notes.md

      # OIDC trusted publishing: no NODE_AUTH_TOKEN; npm authenticates via the id-token and
      # auto-generates provenance. --access public keeps the scoped package public.
      # (`npm publish` still runs this package's own prepublishOnly build — --ignore-scripts
      # above disables DEPENDENCY lifecycle hooks, not our own publish pipeline.)
      - name: Publish to npm (Trusted Publishing)
        run: npm publish --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3
        with:
          # `generate_release_notes` stays OFF, deliberately — do not "helpfully" restore it.
          # The action appends the WHOLE generated block (`<body>\n\n<notes>`, see
          # src/github.ts prepareReleaseMutation). Auto-notes as the ONLY content is what
          # published the empty 0.9.7 page; appending them merely demotes that noise rather
          # than removing it. The one part worth keeping was the "Full Changelog" compare
          # link, and synthesizing that needs the previous tag — i.e. fetch-depth: 0 on a
          # publish job — which is not worth a full-history clone for a cosmetic link.
          body_path: /tmp/release-notes.md
