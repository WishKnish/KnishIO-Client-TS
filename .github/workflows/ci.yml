# TS SDK CI — enforces the ESLint gate (cycle 109) + the typecheck gate (cycle 110) + the vitest suite.
# Born-enforced: the repo had no CI, so both gates were local-only/bypassable until now.
name: CI

on: [push, pull_request]

jobs:
  # Catch version drift at commit time, not at release time. The publish workflow already
  # refuses a tag that disagrees with the manifest, but that only fires on a tag push, so
  # drift can sit in master until release day. Same script, no expected version: assert only
  # that the repo agrees with itself.
  version:
    name: version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Declared versions agree
        run: bash .github/scripts/check-version.sh

  gate:
    name: lint + typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          # setup-node v5 enables package-manager caching by default (v4 did not). It detects
          # yarn from the committed .yarnrc.yml and points the cache at yarn's cache folder —
          # but this workflow installs with `npm install`, so that folder never exists and the
          # post-run cache save fails with 'Path Validation Error'. Nothing to cache here.
          package-manager-cache: false

      # No lockfile is committed (package-lock.json is gitignored; yarn is the local PM);
      # npm install resolves fresh and writes an ephemeral package-lock.json for npm audit.
      - name: Install dependencies
        run: npm install

      # Dependency audit gate: fail on high/critical advisories in the published
      # dependency tree (dev tooling is reported by the full audit but not enforced).
      - name: npm audit (prod deps, high+)
        run: npm audit --omit=dev --audit-level=high

      # The c109 lint gate (eslint.config.js, ESLint 9 flat config): 0 errors. `npm run lint`
      # is a pure check (cycle 126 made the package scripts CI-safe-by-default); the local
      # auto-fix variant is `npm run lint:fix`.
      - name: ESLint (lint gate)
        run: npm run lint

      # The c110 typecheck gate (tsc --noEmit): 0 errors.
      - name: Typecheck
        run: npm run typecheck

      # vitest unit suites. `npm test` is one-shot (`vitest run`, cycle 126); the local
      # watch variant is `npm run test:watch`.
      - name: Vitest
        run: npm test

  changelog:
    name: changelog entry for version bump
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the gate diffs against the base commit, which a shallow
      # checkout would not have.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # If package.json's version changed relative to the base commit, CHANGELOG.md
      # must carry a matching `## [<version>]` heading. No version change → no-op.
      # Convention: docs/SDK-RELEASE-CONVENTIONS.md in the KnishIOClientSDK monorepo.
      - name: CHANGELOG entry for the manifest version bump
        # BASE arrives via env, never interpolated into the shell text (workflow-injection hygiene).
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          BASE="${BASE:-}"
          if [ -z "$BASE" ] || [ "$BASE" = '0000000000000000000000000000000000000000' ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No comparable base commit — changelog gate skipped."; exit 0
          fi
          ver() { sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$1" | head -1; }
          git show "$BASE:package.json" > /tmp/base-manifest 2>/dev/null || : > /tmp/base-manifest
          NEW=$(ver package.json); OLD=$(ver /tmp/base-manifest)
          if [ "$NEW" = "$OLD" ]; then echo "version unchanged ($NEW) — nothing to check."; exit 0; fi
          echo "version bumped: ${OLD:-<none>} -> $NEW"
          # index()==1 is a fixed-string match anchored at column 1: no regex escaping of the
          # version, and a deeper `### [x]` heading does NOT satisfy `## [x]` (grep -F would match it).
          if ! awk -v h="## [$NEW]" 'index($0, h) == 1 { f = 1 } END { exit !f }' CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::Version bumped to $NEW but CHANGELOG.md has no '## [$NEW]' entry."
            exit 1
          fi
          echo "OK: CHANGELOG.md documents $NEW"
