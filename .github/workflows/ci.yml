# TS SDK CI — enforces the ESLint gate (cycle 109) + the typecheck gate (cycle 110) + the vitest suite.
# Born-enforced: the repo had no CI, so both gates were local-only/bypassable until now.
#
# Supply-chain hardening (ChainDrop response, 2026-08):
# - persist-credentials: false on every checkout — no workflow here pushes, and the
#   ChainDrop worm reads the checkout token straight out of .git/config.
# - Dependency resolution is SCRIPT-FREE and COOLDOWN-GATED (--package-lock-only
#   --ignore-scripts --before=7d), then `npm ci --ignore-scripts` installs exactly that
#   set. A dep that genuinely needs its build script gets a NAMED `npm rebuild <pkg>`
#   step — never a wholesale scripts re-enable.
# - Cooldown valve: --before also delays legitimate FIXES younger than 7 days; review
#   such a version manually (publish date + provenance) instead of dropping the flag.
name: CI

on: [push, pull_request]

jobs:
  # Catch version drift at commit time, not at release time. The publish workflow already
  # refuses a tag that disagrees with the manifest, but that only fires on a tag push, so
  # drift can sit in master until release day. Same script, no expected version: assert only
  # that the repo agrees with itself.
  version:
    name: version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - name: Declared versions agree
        run: bash .github/scripts/check-version.sh

  gate:
    name: lint + typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      # Prove the checkout kept no credential: with persist-credentials: false the
      # extraheader must be absent. A malicious dependency script (the ChainDrop vector)
      # would otherwise find a live repo-scoped token here.
      - name: Assert no persisted git credential
        run: |
          if git config --local --get http.https://github.com/.extraheader; then
            echo "::error::checkout persisted a credential despite persist-credentials: false"
            exit 1
          fi
          echo "OK: no credential in .git/config"

      - name: Setup Node 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: '20'
          # setup-node v5 enables package-manager caching by default (v4 did not). It detects
          # yarn from the committed .yarnrc.yml and points the cache at yarn's cache folder —
          # but this workflow installs with `npm install`, so that folder never exists and the
          # post-run cache save fails with 'Path Validation Error'. Nothing to cache here.
          package-manager-cache: false

      # yarn.lock IS committed here (yarn is the local PM), but this workflow audits the
      # npm-side resolution: resolve fresh WITHOUT executing any lifecycle script
      # (--package-lock-only writes an ephemeral package-lock.json; package-lock.json
      # stays gitignored) and refuse any version published in the last 7 days.
      - name: Resolve dependencies (script-free, 7-day cooldown)
        run: |
          set -euo pipefail
          CUTOFF="$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          # Named cooldown exception (ChainDrop policy: review the version, never drop the flag).
          # zod@4.5.4 — published 2026-08-29T17:55:42Z by GitHub Actions via npm Trusted
          # Publishing (OIDC, no human token), SLSA v1 provenance attestation present, zero
          # runtime dependencies. Required by the Zod 4 migration (zod 3 is EOL and the SDK's
          # schemas no longer parse under it). SELF-EXPIRING: from 2026-09-05T18:00Z the rolling
          # window is already later than the floor, the floor stops binding, and this block can
          # be reduced back to the single-line rolling resolve.
          FLOOR='2026-08-29T18:00:00Z'
          if [ "$CUTOFF" \< "$FLOOR" ]; then CUTOFF="$FLOOR"; fi
          echo "cooldown cutoff: $CUTOFF"
          npm install --package-lock-only --ignore-scripts --before="$CUTOFF"

      # Dependency audit gate: fail on high/critical advisories in the published
      # dependency tree (dev tooling is reported by the full audit but not enforced).
      # Reads the lockfile written above — no install needed.
      - name: npm audit (prod deps, high+)
        run: npm audit --omit=dev --audit-level=high

      # Install exactly the resolved set, still without lifecycle scripts. Platform
      # binaries (esbuild, @rollup) arrive as optionalDependencies and need no scripts.
      - name: Install dependencies (locked, no lifecycle scripts)
        run: npm ci --ignore-scripts

      # The c109 lint gate (eslint.config.js, ESLint 9 flat config): 0 errors. `npm run lint`
      # is a pure check (cycle 126 made the package scripts CI-safe-by-default); the local
      # auto-fix variant is `npm run lint:fix`.
      - name: ESLint (lint gate)
        run: npm run lint

      # The c110 typecheck gate (tsc --noEmit): 0 errors.
      - name: Typecheck
        run: npm run typecheck

      # vitest unit suites. `npm test` is one-shot (`vitest run`, cycle 126); the local
      # watch variant is `npm run test:watch`.
      - name: Vitest
        run: npm test

  changelog:
    name: changelog entry for version bump
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the gate diffs against the base commit, which a shallow
      # checkout would not have. persist-credentials: false — the diff below reads
      # local objects only; no credential is needed after clone.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # If package.json's version changed relative to the base commit, CHANGELOG.md
      # must carry a matching `## [<version>]` heading. No version change → no-op.
      # Convention: docs/SDK-RELEASE-CONVENTIONS.md in the KnishIOClientSDK monorepo.
      - name: CHANGELOG entry for the manifest version bump
        # BASE arrives via env, never interpolated into the shell text (workflow-injection hygiene).
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          BASE="${BASE:-}"
          if [ -z "$BASE" ] || [ "$BASE" = '0000000000000000000000000000000000000000' ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No comparable base commit — changelog gate skipped."; exit 0
          fi
          ver() { sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$1" | head -1; }
          git show "$BASE:package.json" > /tmp/base-manifest 2>/dev/null || : > /tmp/base-manifest
          NEW=$(ver package.json); OLD=$(ver /tmp/base-manifest)
          if [ "$NEW" = "$OLD" ]; then echo "version unchanged ($NEW) — nothing to check."; exit 0; fi
          echo "version bumped: ${OLD:-<none>} -> $NEW"
          # index()==1 is a fixed-string match anchored at column 1: no regex escaping of the
          # version, and a deeper `### [x]` heading does NOT satisfy `## [x]` (grep -F would match it).
          if ! awk -v h="## [$NEW]" 'index($0, h) == 1 { f = 1 } END { exit !f }' CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::Version bumped to $NEW but CHANGELOG.md has no '## [$NEW]' entry."
            exit 1
          fi
          echo "OK: CHANGELOG.md documents $NEW"
