# Dependabot — keeps GitHub Actions current, and keeps the SHA pins updatable.
#
# Two reasons this file exists, and the second is the important one:
#
#   1. Until 2026-08-05 nothing watched these actions. Every bump was a manual sweep triggered
#      by a deprecation warning, which is how this fleet ended up running a node16 action
#      (softprops/action-gh-release@v1) that actionlint refused outright. Drift accumulated
#      invisibly until GitHub force-retired a runtime and 8 repos broke at once, on GitHub's
#      schedule rather than ours.
#
#   2. Every `uses:` here is pinned to a 40-character commit SHA rather than a mutable tag,
#      because these workflows hold `id-token: write` (OIDC trusted publishing) and
#      `contents: write` — a repointed tag could mint a registry token and ship a backdoored
#      SDK under legitimate provenance. But a SHA pin with no updater is a pin that FREEZES:
#      it trades a mutable-ref risk for an unpatched-dependency risk. Dependabot understands
#      SHA pins, bumps them, and rewrites the trailing version comment. The pinning and this
#      file are only correct together.
#
# Grouped into a single PR per week so eight repos do not produce a wall of one-line PRs.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  # The LIBRARY ecosystem, separate from github-actions above so the two arrive as two
  # distinguishable PRs a week rather than one mixed pile ("ci" vs "build" prefixes).
  #
  # cooldown: a release younger than 7 days is not proposed AT ALL. The ChainDrop class of
  # attack is a malicious version that is live for hours before anyone notices it, so the
  # defence is refusing to be the first consumer of anything. It delays legitimate fixes by
  # the same week — that is the trade, made knowingly.
  # This is the Dependabot-side twin of the CI resolver's --before=7d window in ci.yml; the
  # two must move together, or one path silently accepts what the other refuses.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns:
          - "*"
    commit-message:
      prefix: "build"
    # graphql 17 requires Node ^22 || ^24 || ^25 || >=26. graphql is a RUNTIME dependency here
    # and this package advertises engines.node ">=18.0.0", so adopting the major would silently
    # break every consumer on Node 18/20 — npm does not enforce engines, so CI goes green and
    # the breakage surfaces at the consumer instead. Taking it requires raising this SDK's own
    # Node floor first, which is a deliberate breaking release, not a dependency bump.
    # Minor and patch graphql updates are still proposed.
    ignore:
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]
      # typescript >= 6.1.0 fails the whole grouped npm update (every weekly run since 2026-09-17):
      # @typescript-eslint/parser and eslint-plugin 8.x declare the peer typescript ">=4.8.4 <6.1.0"
      # (Yarn YN0060, the "peer dependencies are incorrectly met" Dependabot reports), and Yarn
      # 4.15's builtin compat/typescript patch cannot apply to 7.x (YN0001 ENOENT lib/_tsc.js), so
      # `yarn add typescript@7.0.2 --mode=skip-build` exits 1. Lift this only when BOTH hold: a
      # typescript-eslint release whose peer range admits the new typescript, and a Yarn release
      # whose builtin typescript patch supports it (check: `yarn add -D typescript@<ver>
      # --mode=skip-build` exits 0).
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
